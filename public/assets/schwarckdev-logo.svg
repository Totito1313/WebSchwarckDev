<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#3ddc84" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Base Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="2.5" />
  
  <!-- Stylized 'S' & Tech Bracket Monogram -->
  <path d="M42 36 L28 60 L42 84" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M78 36 L92 60 L78 84" stroke="#3ddc84" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Central 'S' geometric ribbon -->
  <path d="M68 44 C68 44 48 42 48 54 C48 66 72 63 72 75 C72 86 52 86 52 86" stroke="url(#glowGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)" />
  
  <!-- Subtle accent dot -->
  <circle cx="60" cy="24" r="3" fill="#3ddc84" />
</svg>
